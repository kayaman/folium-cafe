name: CI

on:
  pull_request:
    branches: [main]

permissions:
  id-token: write
  contents: read

# Run the bundled JS actions (checkout, setup-node, configure-aws-credentials,
# setup-terraform) on Node 24. Their pinned majors still ship a Node 20 runtime,
# which GitHub forces to Node 24 on 2026-06-16 and removes on 2026-09-16.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  build-and-plan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build frontend
        run: |
          npm ci
          npm run build

      - name: Typecheck (i18n dict parity)
        run: npx tsc --noEmit

      - name: i18n key coverage
        run: node scripts/i18n-check.mjs

      - name: Install backend deps
        working-directory: backend
        run: npm ci

      - name: Backend tests
        working-directory: backend
        run: npm test

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.10.5

      - name: Terraform fmt
        working-directory: infra
        run: terraform fmt -check -recursive

      - name: Terraform init
        working-directory: infra
        run: terraform init -input=false

      - name: Terraform validate
        working-directory: infra
        run: terraform validate

      - name: Terraform plan
        working-directory: infra
        run: terraform plan -input=false -no-color
